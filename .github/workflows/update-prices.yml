name: 楽天価格の自動更新

on:
  schedule:
    # 毎日 03:37 JST
    - cron: '37 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 楽天市場から価格を取得
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: |
          if [ -z "$RAKUTEN_APPLICATION_ID" ] || [ -z "$RAKUTEN_ACCESS_KEY" ] || [ -z "$RAKUTEN_AFFILIATE_ID" ]; then
            echo "楽天のキーが未登録のため、スプレッドシートの要確認リストだけ更新します"
            node scripts/update-rakuten-prices.js --audit-only
          else
            node scripts/update-rakuten-prices.js
          fi
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "chore: 価格データと要確認リストを自動更新"
          git push

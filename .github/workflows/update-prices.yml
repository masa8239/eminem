name: 価格の自動更新

on:
  schedule:
    # 毎日 03:37 JST
    - cron: '37 18 * * *'
  workflow_dispatch:
  # .github/run-prices.txt を書き換えて main に入れると、すぐに1回実行する（手動実行の代わり）。
  # 価格取得が自分で保存するのは data/ などなので、この実行がさらに実行を呼ぶことはない
  push:
    branches: [main]
    paths: ['.github/run-prices.txt']

permissions:
  contents: write

concurrency:
  group: update-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ストアから価格を取得
        env:
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
        run: |
          if { [ -z "$RAKUTEN_APPLICATION_ID" ] || [ -z "$RAKUTEN_ACCESS_KEY" ] || [ -z "$RAKUTEN_AFFILIATE_ID" ]; } && [ -z "$YAHOO_CLIENT_ID" ]; then
            echo "ストアのキーが未登録のため、スプレッドシートの要確認リストだけ更新します"
            node scripts/update-rakuten-prices.js --audit-only
          else
            node scripts/update-rakuten-prices.js
          fi
      - name: 製品ページとサイトマップを作る
        run: node scripts/build-pages.js || echo "製品ページの作成に失敗しました（価格の更新は続けます）"
      - name: 変更があればコミット
        run: |
          if git diff --quiet -- data p sitemap.xml robots.txt && [ -z "$(git ls-files --others --exclude-standard -- p data)" ]; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data p sitemap.xml robots.txt
          git commit -m "chore: 価格データ・製品ページ・要確認リストを自動更新"
          # 処理中に main が更新されていたら、取り込んでから保存する（自動生成のファイルはこの回の内容を優先）
          for i in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase -X theirs origin main || { git rebase --abort; exit 1; }
            sleep $((i * 5))
          done
          exit 1
